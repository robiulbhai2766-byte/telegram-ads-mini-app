<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ad Earning App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--tg-theme-bg-color, #0f0f0f);
    color: var(--tg-theme-text-color, #f0f0f0);
    margin: 0; padding: 20px; text-align: center;
  }
  .balance { font-size: 2.2rem; font-weight: 700; margin: 20px 0 4px; }
  .label { opacity: .6; font-size: .85rem; }
  button {
    width: 100%; padding: 16px; margin-top: 20px; border: none; border-radius: 14px;
    font-size: 1.05rem; font-weight: 600; cursor: pointer;
    background: var(--tg-theme-button-color, #2ea6ff);
    color: var(--tg-theme-button-text-color, #fff);
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .timer { font-size: 1.4rem; margin-top: 16px; font-variant-numeric: tabular-nums; }
  .status { margin-top: 14px; font-size: .9rem; min-height: 20px; }
  .status.error { color: #ff6b6b; }
  .status.success { color: #51cf66; }
</style>
</head>
<body>
  <div class="label">Your balance</div>
  <div class="balance" id="balance">$0.0000</div>

  <button id="watchBtn">▶️ Watch Ad & Earn</button>
  <div class="timer" id="timer"></div>
  <div class="status" id="status"></div>

  <script src="app.js"></script>
</body>
</html>
